    .interactive-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .building-hotspot {
      opacity: 0;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .building-hotspot:hover {
      opacity: 0.2;
      fill: #D6AC59;
    }

    /* MOBILE CONTROLS */
    .mobile-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      gap: 10px;
    }

    .mobile-controls.active {
      display: flex;
    }

    .mobile-btn {
      flex: 1;
      padding: 12px;
      background: rgba(214, 172, 89, 0.9);
      border: 1px solid #D6AC59;
      color: #080811;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mobile-btn:active {
      background: #D6AC59;
      transform: scale(0.98);
    }

    /* BUILDING DIRECTORY MODAL */
    .directory-modal {
      position: absolute;
      inset: 0;
      background: rgba(8, 8, 17, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .directory-modal.active {
      display: flex;
    }

    .directory-header {
      font-size: 24px;
      font-weight: 700;
      color: #D6AC59;
      margin-bottom: 20px;
      text-align: center;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .directory-item {
      padding: 15px;
      background: rgba(214, 172, 89, 0.1);
      border: 1px solid #D6AC59;
      border-radius: 6px;
      color: #D6AC59;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .directory-item:active {
      background: #D6AC59;
      color: #080811;
    }

    .directory-close {
      padding: 10px;
      background: #D6AC59;
      color: #080811;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: auto;
    }

    /* DEPARTMENT VIEWS */
    .department-view {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      z-index: 30;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .department-view.active {
      display: flex;
    }

    .department-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #D6AC59;
    }

    .department-title {
      font-size: 28px;
      font-weight: 700;
      color: #D6AC59;
    }

    .back-btn {
      padding: 8px 16px;
      background: #D6AC59;
      color: #080811;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .back-btn:active {
      opacity: 0.8;
    }

    .department-content {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    /* ACADEMY STYLES */
    .course-item {
      background: rgba(214, 172, 89, 0.1);
      border: 1px solid #D6AC59;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .course-item:active {
      background: rgba(214, 172, 89, 0.2);
    }

    .course-title {
      font-size: 16px;
      font-weight: 600;
      color: #D6AC59;
      margin-bottom: 5px;
    }

    .course-meta {
      font-size: 12px;
      color: #9A55EA;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(214, 172, 89, 0.2);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #D6AC59;
      transition: width 0.3s ease;
    }

    /* FORM STYLES */
    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #D6AC59;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 10px;
      background: rgba(214, 172, 89, 0.1);
      border: 1px solid #D6AC59;
      color: #f5efdf;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-input::placeholder, .form-textarea::placeholder {
      color: rgba(245, 239, 223, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #D6AC59;
      color: #080811;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn:active {
      opacity: 0.8;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* CHARACTER GRID */
    .character-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .character-card {
      background: rgba(214, 172, 89, 0.1);
      border: 1px solid #D6AC59;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .character-card:active {
      background: rgba(214, 172, 89, 0.2);
      border-color: #F1CE83;
    }

    .character-name {
      font-size: 13px;
      font-weight: 600;
      color: #D6AC59;
    }

    .character-age {
      font-size: 11px;
      color: #9A55EA;
      margin-top: 4px;
    }

    /* PROJECT SELECTOR */
    .project-selector {
      padding: 12px;
      background: rgba(214, 172, 89, 0.1);
      border: 1px solid #D6AC59;
      border-radius: 6px;
      color: #f5efdf;
      margin-bottom: 15px;
      font-size: 13px;
    }

    /* LOADING STATE */
    .loading {
      text-align: center;
      padding: 20px;
      color: #9A55EA;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #D6AC59;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ERROR STATE */
    .error-message {
      padding: 12px;
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      border-radius: 6px;
      color: #ff6b7a;
      font-size: 12px;
      margin-bottom: 15px;
    }

    /* SUCCESS STATE */
    .success-message {
      padding: 12px;
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid #28a745;
      border-radius: 6px;
      color: #66bb6a;
      font-size: 12px;
      margin-bottom: 15px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }

      .department-header {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }

      .department-title {
        font-size: 20px;
      }

      .back-btn {
        align-self: flex-start;
      }

      .character-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ============================================================================
    // CONFIGURATION
    // ============================================================================

    const API_URL = process.env.REACT_APP_API_URL || 'https://ashiakeyz-akfu-production.up.railway.app/api';
    const IS_MOBILE = typeof window !== 'undefined' && window.innerWidth < 768;

    const BUILDINGS = [
      { id: 1, name: "Writers' Room", x: 280, y: 220, width: 120, height: 140, title: "WRITERS' ROOM", subtitle: "DEVELOP • WRITE • PLAN", route: 'writers-room' },
      { id: 2, name: "The Academy", x: 520, y: 180, width: 150, height: 160, title: "THE ACADEMY", subtitle: "LEARN • MASTER • GROW", route: 'academy' },
      { id: 3, name: "Director's Command Center", x: 780, y: 200, width: 130, height: 150, title: "DIRECTOR'S COMMAND CENTER", subtitle: "PLAN • MANAGE • BRING IT TO LIFE", route: 'command-center' },
      { id: 4, name: "Dressing Room", x: 180, y: 350, width: 120, height: 130, title: "DRESSING ROOM", subtitle: "STYLE • TRANSFORM • IMAGINE", route: 'dressing-room' },
      { id: 5, name: "Casting Studio", x: 420, y: 340, width: 140, height: 120, title: "CASTING STUDIO", subtitle: "DISCOVER • CAST • COLLABORATE", route: 'casting-studio' },
      { id: 6, name: "Soundstage", x: 200, y: 520, width: 160, height: 140, title: "SOUNDSTAGE", subtitle: "SHOOT • DIRECT • PRODUCE", route: 'soundstage' },
      { id: 7, name: "Sound Lab", x: 470, y: 540, width: 130, height: 120, title: "SOUND LAB", subtitle: "MIX • DESIGN • MASTER", route: 'sound-lab' },
      { id: 8, name: "Editing Suite", x: 700, y: 520, width: 140, height: 130, title: "EDITING SUITE", subtitle: "CUT • EDIT • PERFECT", route: 'editing-suite' },
      { id: 9, name: "Talent Agency", x: 900, y: 380, width: 120, height: 140, title: "TALENT AGENCY", subtitle: "HIRE AGENTS • BUILD YOUR TEAM", route: 'talent-agency' },
      { id: 10, name: "Premiere Lounge", x: 850, y: 540, width: 140, height: 130, title: "PREMIERE LOUNGE", subtitle: "SCREEN • NETWORK • CELEBRATE", route: 'premiere-lounge' },
      { id: 11, name: "Connected Apps", x: 950, y: 100, width: 140, height: 120, title: "CONNECTED APPS", subtitle: "INTEGRATE • PUBLISH • SHARE • GO GLOBAL", route: 'connected-apps' },
      { id: 12, name: "Welcome Hub", x: 530, y: 380, width: 160, height: 150, title: "WELCOME HUB", subtitle: "DIRECTOR PLAZA • YOUR JOURNEY STARTS HERE", route: 'welcome-hub' }
    ];

    // ============================================================================
    // API HELPER
    // ============================================================================

    async function apiCall(endpoint, options = {}) {
      try {
        const response = await fetch(`${API_URL}${endpoint}`, {
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token') || ''}`,
            ...options.headers
          },
          ...options
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();
        return { success: true, data };
      } catch (error) {
        console.error('API Error:', error);
        return { success: false, error: error.message };
      }
    }

    // ============================================================================
    // ACADEMY COMPONENT
    // ============================================================================

    function Academy({ onBack, projectId, userId }) {
      const [courses, setCourses] = useState([]);
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [progress, setProgress] = useState({});
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadCourses();
      }, []);

      async function loadCourses() {
        const result = await apiCall('/academy/courses');
        if (result.success) {
          setCourses(result.data.courses || []);
        }
        setLoading(false);
      }

      async function completeLessonHandler(lessonId) {
        const result = await apiCall('/academy/progress', {
          method: 'POST',
          body: JSON.stringify({
            user_id: userId,
            lesson_id: lessonId,
            status: 'completed'
          })
        });
        if (result.success) {
          loadCourses();
        }
      }

      if (loading) {
        return (
          <div className="department-view active">
            <div className="department-header">
              <div className="department-title">ACADEMY</div>
              <button className="back-btn" onClick={onBack}>← Campus</button>
            </div>
            <div className="loading"><div className="spinner"></div></div>
          </div>
        );
      }

      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">ACADEMY</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>
          <div className="department-content">
            {courses.map(course => (
              <div key={course.id} className="course-item" onClick={() => setSelectedCourse(course.id)}>
                <div className="course-title">{course.title}</div>
                <div className="course-meta">Module {course.module_number}</div>
                <div className="progress-bar">
                  <div className="progress-fill" style={{ width: '0%' }}></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================================
    // WRITERS' ROOM COMPONENT
    // ============================================================================

    function WritersRoom({ onBack, projectId, userId }) {
      const [scripts, setScripts] = useState([]);
      const [selectedScript, setSelectedScript] = useState(null);
      const [scriptContent, setScriptContent] = useState('');
      const [title, setTitle] = useState('');
      const [mode, setMode] = useState('list'); // list, create, edit

      useEffect(() => {
        if (projectId) loadScripts();
      }, [projectId]);

      async function loadScripts() {
        const result = await apiCall(`/projects/${projectId}/scripts`);
        if (result.success) {
          setScripts(result.data.scripts || []);
        }
      }

      async function createScript() {
        const result = await apiCall('/scripts/create', {
          method: 'POST',
          body: JSON.stringify({
            project_id: projectId,
            title: title || 'Untitled Script',
            user_id: userId
          })
        });

        if (result.success) {
          setScriptContent('');
          setTitle('');
          setMode('list');
          loadScripts();
        }
      }

      async function saveScript() {
        if (!selectedScript) return;

        const result = await apiCall(`/scripts/${selectedScript.id}/content`, {
          method: 'PUT',
          body: JSON.stringify({
            content: scriptContent
          })
        });

        if (result.success) {
          setMode('list');
          loadScripts();
        }
      }

      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">WRITERS' ROOM</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>

          <div className="department-content">
            {mode === 'list' && (
              <>
                <button className="submit-btn" onClick={() => setMode('create')} style={{ marginBottom: '15px' }}>
                  + New Script
                </button>
                {scripts.map(script => (
                  <div
                    key={script.id}
                    className="course-item"
                    onClick={() => {
                      setSelectedScript(script);
                      setScriptContent(script.content || '');
                      setMode('edit');
                    }}
                  >
                    <div className="course-title">{script.title}</div>
                    <div className="course-meta">{script.page_count || 0} pages</div>
                  </div>
                ))}
              </>
            )}

            {mode === 'create' && (
              <>
                <div className="form-group">
                  <label className="form-label">Script Title</label>
                  <input
                    type="text"
                    className="form-input"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="Enter script title"
                  />
                </div>
                <button className="submit-btn" onClick={createScript}>Create Script</button>
                <button className="submit-btn" onClick={() => setMode('list')} style={{ background: '#666', marginTop: '10px' }}>Cancel</button>
              </>
            )}

            {mode === 'edit' && selectedScript && (
              <>
                <div className="form-group">
                  <label className="form-label">{selectedScript.title}</label>
                  <textarea
                    className="form-textarea"
                    value={scriptContent}
                    onChange={(e) => setScriptContent(e.target.value)}
                    placeholder="Write your screenplay here..."
                  ></textarea>
                </div>
                <button className="submit-btn" onClick={saveScript}>Save Script</button>
                <button className="submit-btn" onClick={() => setMode('list')} style={{ background: '#666', marginTop: '10px' }}>Back to List</button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // CASTING STUDIO COMPONENT
    // ============================================================================

    function CastingStudio({ onBack, projectId, userId }) {
      const [characters, setCharacters] = useState([]);
      const [mode, setMode] = useState('list'); // list, create, edit
      const [selectedCharacter, setSelectedCharacter] = useState(null);
      const [form, setForm] = useState({
        name: '',
        age_range: '',
        appearance: '',
        personality: '',
        backstory: ''
      });

      useEffect(() => {
        if (projectId) loadCharacters();
      }, [projectId]);

      async function loadCharacters() {
        const result = await apiCall(`/projects/${projectId}/characters`);
        if (result.success) {
          setCharacters(result.data.characters || []);
        }
      }

      async function createCharacter() {
        const result = await apiCall('/characters/create', {
          method: 'POST',
          body: JSON.stringify({
            project_id: projectId,
            user_id: userId,
            ...form
          })
        });

        if (result.success) {
          setForm({ name: '', age_range: '', appearance: '', personality: '', backstory: '' });
          setMode('list');
          loadCharacters();
        }
      }

      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">CASTING STUDIO</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>

          <div className="department-content">
            {mode === 'list' && (
              <>
                <button className="submit-btn" onClick={() => setMode('create')} style={{ marginBottom: '15px' }}>
                  + Create Character
                </button>
                <div className="character-grid">
                  {characters.map(char => (
                    <div key={char.id} className="character-card">
                      <div className="character-name">{char.name}</div>
                      <div className="character-age">{char.age_range}</div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {mode === 'create' && (
              <>
                <div className="form-group">
                  <label className="form-label">Character Name</label>
                  <input
                    type="text"
                    className="form-input"
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                    placeholder="Character name"
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Age Range</label>
                  <input
                    type="text"
                    className="form-input"
                    value={form.age_range}
                    onChange={(e) => setForm({ ...form, age_range: e.target.value })}
                    placeholder="e.g., 25-30"
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Appearance</label>
                  <textarea
                    className="form-textarea"
                    value={form.appearance}
                    onChange={(e) => setForm({ ...form, appearance: e.target.value })}
                    placeholder="Describe appearance..."
                  ></textarea>
                </div>
                <div className="form-group">
                  <label className="form-label">Personality</label>
                  <textarea
                    className="form-textarea"
                    value={form.personality}
                    onChange={(e) => setForm({ ...form, personality: e.target.value })}
                    placeholder="Describe personality..."
                  ></textarea>
                </div>
                <button className="submit-btn" onClick={createCharacter}>Create Character</button>
                <button className="submit-btn" onClick={() => setMode('list')} style={{ background: '#666', marginTop: '10px' }}>Cancel</button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // DRESSING ROOM COMPONENT
    // ============================================================================

    function DressingRoom({ onBack, projectId, userId }) {
      const [characters, setCharacters] = useState([]);
      const [selectedCharacter, setSelectedCharacter] = useState(null);
      const [outfits, setOutfits] = useState([]);
      const [mode, setMode] = useState('list'); // list, create
      const [outfitForm, setOutfitForm] = useState({
        name: '',
        description: '',
        inspiration: ''
      });

      useEffect(() => {
        if (projectId) {
          loadCharacters();
          loadOutfits();
        }
      }, [projectId]);

      async function loadCharacters() {
        const result = await apiCall(`/projects/${projectId}/characters`);
        if (result.success) {
          setCharacters(result.data.characters || []);
        }
      }

      async function loadOutfits() {
        const result = await apiCall(`/projects/${projectId}/wardrobe`);
        if (result.success) {
          setOutfits(result.data.outfits || []);
        }
      }

      async function createOutfit() {
        if (!selectedCharacter) return;

        const result = await apiCall('/wardrobe/outfits/create', {
          method: 'POST',
          body: JSON.stringify({
            project_id: projectId,
            character_id: selectedCharacter.id,
            user_id: userId,
            ...outfitForm
          })
        });

        if (result.success) {
          setOutfitForm({ name: '', description: '', inspiration: '' });
          setMode('list');
          loadOutfits();
        }
      }

      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">DRESSING ROOM</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>

          <div className="department-content">
            {mode === 'list' && (
              <>
                <div className="form-group">
                  <label className="form-label">Select Character</label>
                  <select className="form-input" onChange={(e) => {
                    const char = characters.find(c => c.id === e.target.value);
                    setSelectedCharacter(char);
                  }}>
                    <option value="">Choose character...</option>
                    {characters.map(char => (
                      <option key={char.id} value={char.id}>{char.name}</option>
                    ))}
                  </select>
                </div>
                <button className="submit-btn" onClick={() => setMode('create')} disabled={!selectedCharacter} style={{ marginBottom: '15px' }}>
                  + Create Outfit
                </button>
                <div>
                  {outfits.map(outfit => (
                    <div key={outfit.id} className="course-item">
                      <div className="course-title">{outfit.name}</div>
                      <div className="course-meta">{outfit.description}</div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {mode === 'create' && selectedCharacter && (
              <>
                <div className="form-group">
                  <label className="form-label">Outfit Name</label>
                  <input
                    type="text"
                    className="form-input"
                    value={outfitForm.name}
                    onChange={(e) => setOutfitForm({ ...outfitForm, name: e.target.value })}
                    placeholder="Outfit name"
                  />
                </div>
                <div className="form-group">
                  <label className="form-label">Description</label>
                  <textarea
                    className="form-textarea"
                    value={outfitForm.description}
                    onChange={(e) => setOutfitForm({ ...outfitForm, description: e.target.value })}
                    placeholder="Describe the outfit..."
                  ></textarea>
                </div>
                <div className="form-group">
                  <label className="form-label">Inspiration</label>
                  <input
                    type="text"
                    className="form-input"
                    value={outfitForm.inspiration}
                    onChange={(e) => setOutfitForm({ ...outfitForm, inspiration: e.target.value })}
                    placeholder="Styling inspiration"
                  />
                </div>
                <button className="submit-btn" onClick={createOutfit}>Save Outfit</button>
                <button className="submit-btn" onClick={() => setMode('list')} style={{ background: '#666', marginTop: '10px' }}>Cancel</button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // WELCOME HUB COMPONENT
    // ============================================================================

    function WelcomeHub({ onBack, onOpenDepartment }) {
      const [projects, setProjects] = useState([]);
      const [newProjectTitle, setNewProjectTitle] = useState('');

      async function createProject() {
        if (!newProjectTitle) return;

        const result = await apiCall('/projects/create', {
          method: 'POST',
          body: JSON.stringify({
            user_id: 'user-123', // TODO: get actual user
            title: newProjectTitle,
            project_type: 'film'
          })
        });

        if (result.success) {
          setNewProjectTitle('');
          // loadProjects();
        }
      }

      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">WELCOME HUB</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>

          <div className="department-content">
            <div style={{ marginBottom: '20px' }}>
              <h3 style={{ color: '#D6AC59', marginBottom: '10px' }}>Welcome Back, Director</h3>
              <p style={{ color: '#9A55EA', fontSize: '13px' }}>What would you like to create today?</p>
            </div>

            <div className="form-group">
              <label className="form-label">Create New Project</label>
              <input
                type="text"
                className="form-input"
                value={newProjectTitle}
                onChange={(e) => setNewProjectTitle(e.target.value)}
                placeholder="Enter project title"
              />
              <button className="submit-btn" onClick={createProject} style={{ marginTop: '10px' }}>
                Start Project
              </button>
            </div>

            <div style={{ marginTop: '30px', paddingTop: '20px', borderTop: '1px solid #D6AC59' }}>
              <h4 style={{ color: '#D6AC59', marginBottom: '15px', fontSize: '14px' }}>Quick Start</h4>
              <button className="submit-btn" onClick={() => onOpenDepartment('writers-room')} style={{ marginBottom: '10px' }}>
                Write Script
              </button>
              <button className="submit-btn" onClick={() => onOpenDepartment('casting-studio')} style={{ marginBottom: '10px' }}>
                Create Character
              </button>
              <button className="submit-btn" onClick={() => onOpenDepartment('dressing-room')} style={{ marginBottom: '10px' }}>
                Design Outfit
              </button>
              <button className="submit-btn" onClick={() => onOpenDepartment('academy')} style={{ marginBottom: '10px' }}>
                Continue Learning
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // PLACEHOLDER COMPONENTS
    // ============================================================================

    function PlaceholderDepartment({ title, onBack }) {
      return (
        <div className="department-view active">
          <div className="department-header">
            <div className="department-title">{title}</div>
            <button className="back-btn" onClick={onBack}>← Campus</button>
          </div>
          <div className="department-content">
            <div className="success-message">
              Coming soon: Full functionality for {title} is being implemented.
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // MAIN APP COMPONENT
    // ============================================================================

    function App() {
      const [currentDepartment, setCurrentDepartment] = useState(null);
      const [projectId, setProjectId] = useState('project-123');
      const [userId, setUserId] = useState('user-123');
      const [showDirectory, setShowDirectory] = useState(false);

      const handleBuildingClick = (building) => {
        setCurrentDepartment(building.route);
      };

      const handleBackToCampus = () => {
        setCurrentDepartment(null);
      };

      const handleOpenDepartment = (route) => {
        setCurrentDepartment(route);
      };

      const renderDepartment = () => {
        switch (currentDepartment) {
          case 'academy':
            return <Academy onBack={handleBackToCampus} projectId={projectId} userId={userId} />;
          case 'writers-room':
            return <WritersRoom onBack={handleBackToCampus} projectId={projectId} userId={userId} />;
          case 'casting-studio':
            return <CastingStudio onBack={handleBackToCampus} projectId={projectId} userId={userId} />;
          case 'dressing-room':
            return <DressingRoom onBack={handleBackToCampus} projectId={projectId} userId={userId} />;
          case 'welcome-hub':
            return <WelcomeHub onBack={handleBackToCampus} onOpenDepartment={handleOpenDepartment} />;
          case 'command-center':
          case 'soundstage':
          case 'sound-lab':
          case 'editing-suite':
          case 'talent-agency':
          case 'premiere-lounge':
          case 'connected-apps':
            return <PlaceholderDepartment title={currentDepartment.toUpperCase().replace('-', ' ')} onBack={handleBackToCampus} />;
          default:
            return null;
        }
      };

      return (
        <div className="cinema-container">
          {!currentDepartment && (
            <>
              <div className="campus-stage">
                <div className="campus-image-container">
                  <div className="campus-bg" />
                  <div className="interactive-layer">
                    <svg viewBox="0 0 1290 720" preserveAspectRatio="xMidYMid meet">
                      {BUILDINGS.map(building => (
                        <rect
                          key={building.id}
                          className="building-hotspot"
                          x={building.x}
                          y={building.y}
                          width={building.width}
                          height={building.height}
                          onClick={() => handleBuildingClick(building)}
                        />
                      ))}
                    </svg>
                  </div>
                </div>
              </div>

              {IS_MOBILE && (
                <>
                  <div className="mobile-controls active">
                    <button className="mobile-btn" onClick={() => setShowDirectory(false)}>
                      VIEW FULL CAMPUS
                    </button>
                    <button className="mobile-btn" onClick={() => setShowDirectory(true)}>
                      BUILDING DIRECTORY
                    </button>
                  </div>

                  {showDirectory && (
                    <div className="directory-modal active">
                      <div className="directory-header">SELECT A BUILDING</div>
                      <div className="directory-grid">
                        {BUILDINGS.map(building => (
                          <button
                            key={building.id}
                            className="directory-item"
                            onClick={() => {
                              handleBuildingClick(building);
                              setShowDirectory(false);
                            }}
                          >
                            {building.name}
                          </button>
                        ))}
                      </div>
                      <button className="directory-close" onClick={() => setShowDirectory(false)}>
                        CLOSE
                      </button>
                    </div>
                  )}
                </>
              )}
            </>
          )}

          {currentDepartment && renderDepartment()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
